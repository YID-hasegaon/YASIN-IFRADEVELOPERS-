<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="theme-color" content="#111111">
<title>YASIN INFRA DEVELOPERS | Management System</title>
<style>
:root{--bg:#101010;--panel:#191919;--panel2:#202020;--gold:#d6ad55;--gold2:#f1d58b;--text:#f4f1e8;--muted:#aaa397;--line:#38332a;--red:#df6868;--green:#69bd88;--blue:#79a9df;--shadow:0 10px 30px #0006}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 Arial,Helvetica,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{min-height:100vh}.topbar{position:sticky;top:0;z-index:10;background:#111e;border-bottom:1px solid var(--line);backdrop-filter:blur(12px);display:flex;align-items:center;justify-content:space-between;padding:12px 18px;gap:12px}.brand{display:flex;align-items:center;gap:11px}.logo{width:42px;height:42px;border:2px solid var(--gold);border-radius:10px;display:grid;place-items:center;color:var(--gold);font-weight:900;font-size:19px}.brand h1{font-size:16px;letter-spacing:1px;margin:0;color:var(--gold2)}.brand small{display:block;color:var(--muted);font-size:10px;letter-spacing:2px}.top-actions{display:flex;gap:8px;align-items:center}.layout{display:grid;grid-template-columns:230px 1fr;min-height:calc(100vh - 67px)}.sidebar{border-right:1px solid var(--line);padding:16px 10px;background:#141414}.nav-title{color:#887d68;font-size:10px;letter-spacing:2px;padding:8px 12px}.nav button{display:flex;width:100%;align-items:center;gap:12px;border:0;background:transparent;color:#c9c3b7;padding:11px 12px;border-radius:9px;text-align:left;margin:2px 0}.nav button:hover,.nav button.active{background:#302817;color:var(--gold2)}.nav .ico{width:20px;text-align:center;font-size:16px}.main{padding:22px;max-width:1500px;width:100%;margin:auto}.page-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:20px}.page-head h2{margin:0;font-size:24px}.page-head p{margin:5px 0;color:var(--muted)}.gold{color:var(--gold)}.btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:9px 13px;border-radius:8px}.btn:hover{border-color:var(--gold);color:var(--gold2)}.btn.primary{background:var(--gold);color:#17130b;border-color:var(--gold);font-weight:700}.btn.danger{color:#ffaaaa;border-color:#693b3b}.btn.small{padding:5px 8px;font-size:12px}.grid{display:grid;gap:14px}.stats{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:18px}.card{background:linear-gradient(145deg,#1d1d1d,#171717);border:1px solid var(--line);border-radius:13px;padding:16px;box-shadow:var(--shadow)}.stat-label{color:var(--muted);font-size:12px}.stat-value{font-size:25px;font-weight:800;margin:7px 0 2px;color:var(--gold2)}.stat-foot{font-size:11px;color:var(--muted)}.two{grid-template-columns:1.2fr .8fr}.section-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.section-title h3{margin:0;font-size:16px}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:10px}table{width:100%;border-collapse:collapse;min-width:620px}th,td{padding:11px 12px;text-align:left;border-bottom:1px solid #302d27}th{font-size:11px;color:var(--gold);letter-spacing:.7px;background:#211e18}td{color:#e4dfd4}tr:last-child td{border-bottom:0}.muted{color:var(--muted)}.pill{display:inline-block;padding:3px 8px;border-radius:30px;background:#302817;color:var(--gold2);font-size:11px}.empty{text-align:center;padding:30px;color:var(--muted)}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.search{min-width:190px;flex:1}.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}.field label{font-size:12px;color:var(--muted)}input,select,textarea{background:#111;border:1px solid #454036;border-radius:8px;padding:10px;color:var(--text);width:100%;outline:none}input:focus,select:focus,textarea:focus{border-color:var(--gold)}textarea{min-height:75px;resize:vertical}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 12px}.modal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:15px;z-index:30}.modal.show{display:flex}.modal-box{width:min(650px,100%);max-height:90vh;overflow:auto;background:#1b1b1b;border:1px solid var(--gold);border-radius:14px;padding:18px;box-shadow:var(--shadow)}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.modal-head h3{margin:0;color:var(--gold2)}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}.notice{padding:12px;border:1px solid #62502b;background:#2b2417;border-radius:9px;color:#e8d39c;margin:12px 0}.quick{grid-template-columns:repeat(4,minmax(0,1fr))}.quick button{padding:16px;text-align:left;background:#1b1b1b;border:1px solid var(--line);border-radius:10px;color:var(--text)}.quick button b{display:block;color:var(--gold2);margin-top:6px}.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#282318;color:var(--gold2);border:1px solid var(--gold);padding:10px 16px;border-radius:9px;display:none;z-index:50}.mobile-menu{display:none}.footer{text-align:center;color:#716b60;padding:25px 0 10px;font-size:11px}.danger-text{color:var(--red)}.positive{color:var(--green)}
@media(max-width:900px){.layout{grid-template-columns:1fr}.sidebar{position:fixed;z-index:20;left:-260px;top:67px;bottom:0;width:245px;transition:.2s;box-shadow:var(--shadow)}.sidebar.open{left:0}.mobile-menu{display:inline-flex}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.two{grid-template-columns:1fr}.quick{grid-template-columns:repeat(2,minmax(0,1fr))}.main{padding:16px}}
@media(max-width:480px){.brand h1{font-size:13px}.brand small{font-size:8px}.logo{width:36px;height:36px}.topbar{padding:10px}.top-actions .btn{padding:7px 9px}.page-head h2{font-size:20px}.stats{gap:9px}.card{padding:12px}.stat-value{font-size:21px}.form-grid{grid-template-columns:1fr}.main{padding:12px}}
@media print{.topbar,.sidebar,.toolbar,.btn,.no-print{display:none!important}.layout{display:block}.main{padding:0}.card{box-shadow:none;background:white;color:black;border:1px solid #ccc}body{background:white;color:black}table{min-width:0}th,td{color:black;border-color:#ccc}}
</style></head>
<body><div class="app">
<header class="topbar"><div class="brand"><button class="btn mobile-menu" onclick="toggleMenu()">☰</button><div class="logo">YI</div><div><h1>YASIN INFRA DEVELOPERS</h1><small>CONSTRUCTION MANAGEMENT SYSTEM</small></div></div><div class="top-actions"><button class="btn" onclick="toggleLanguage()" id="langBtn">हिंदी</button><button class="btn" onclick="exportData()">⇩ Backup</button></div></header>
<div class="layout"><aside class="sidebar" id="sidebar"><div class="nav-title" data-en="WORKSPACE" data-hi="कार्य क्षेत्र">WORKSPACE</div><nav class="nav" id="nav">
<button class="active" data-page="dashboard"><span class="ico">▦</span><span data-en="Dashboard" data-hi="डैशबोर्ड">Dashboard</span></button>
<button data-page="projects"><span class="ico">🏗</span><span data-en="Projects" data-hi="प्रोजेक्ट">Projects</span></button>
<button data-page="labour"><span class="ico">👷</span><span data-en="Labour & Attendance" data-hi="मजदूर और हाजिरी">Labour & Attendance</span></button>
<button data-page="materials"><span class="ico">📦</span><span data-en="Material & Stock" data-hi="मटेरियल और स्टॉक">Material & Stock</span></button>
<button data-page="transactions"><span class="ico">₹</span><span data-en="Income & Expense" data-hi="आय और खर्च">Income & Expense</span></button>
<button data-page="contacts"><span class="ico">♙</span><span data-en="Clients & Suppliers" data-hi="ग्राहक और सप्लायर">Clients & Suppliers</span></button>
<button data-page="billing"><span class="ico">▤</span><span data-en="Quotation & Billing" data-hi="कोटेशन और बिलिंग">Quotation & Billing</span></button>
<button data-page="tenders"><span class="ico">▣</span><span data-en="Tenders & Work Orders" data-hi="टेंडर और वर्क ऑर्डर">Tenders & Work Orders</span></button>
<button data-page="machinery"><span class="ico">🚜</span><span data-en="Machinery & Vehicles" data-hi="मशीनरी और वाहन">Machinery & Vehicles</span></button>
<button data-page="reports"><span class="ico">▥</span><span data-en="Reports" data-hi="रिपोर्ट">Reports</span></button>
<button data-page="backup"><span class="ico">☁</span><span data-en="Backup & Settings" data-hi="बैकअप और सेटिंग">Backup & Settings</span></button>
</nav></aside><main class="main" id="main"></main></div></div>
<div class="modal" id="modal"><div class="modal-box"><div class="modal-head"><h3 id="modalTitle">Add Record</h3><button class="btn small" onclick="closeModal()">✕</button></div><form id="recordForm"><div id="formFields"></div><div class="modal-actions"><button type="button" class="btn" onclick="closeModal()" data-en="Cancel" data-hi="रद्द करें">Cancel</button><button class="btn primary" type="submit" data-en="Save Record" data-hi="सेव करें">Save Record</button></div></form></div></div><div class="toast" id="toast"></div>
<script>
const DBKEY='yasin_infra_v1_data';let lang='en',currentPage='dashboard',editingId=null,formType=null;
const blank={projects:[],labour:[],materials:[],transactions:[],contacts:[],billing:[],tenders:[],machinery:[],attendance:[]};let db=loadDB();
function loadDB(){try{return {...blank,...JSON.parse(localStorage.getItem(DBKEY)||'{}')}}catch(e){return {...blank}}}function saveDB(){localStorage.setItem(DBKEY,JSON.stringify(db));}
const schema={projects:{title:['Project Name','प्रोजेक्ट का नाम'],fields:[['name','Project Name','text',1],['client','Client Name','text'],['location','Location','text'],['type','Project Type','select',['Government','Private']],['budget','Budget (₹)','number'],['start','Start Date','date'],['end','Expected End Date','date'],['status','Status','select',['Planning','In Progress','On Hold','Completed']],['notes','Notes','textarea']]},labour:{title:['Labour Details','मजदूर विवरण'],fields:[['name','Labour Name','text',1],['phone','Mobile Number','tel'],['role','Work / Skill','text'],['rate','Daily Wage (₹)','number'],['advance','Advance (₹)','number'],['status','Status','select',['Active','Inactive']],['notes','Notes','textarea']]},materials:{title:['Material / Stock Entry','मटेरियल / स्टॉक'],fields:[['name','Material Name','text',1],['unit','Unit','select',['Bag','Kg','Ton','CFT','Brass','Piece','Litre','Other']],['qty','Quantity','number'],['rate','Rate per Unit (₹)','number'],['supplier','Supplier','text'],['date','Entry Date','date'],['notes','Notes','textarea']]},transactions:{title:['Add Transaction','लेन-देन जोड़ें'],fields:[['kind','Transaction Type','select',['Income','Expense']],['date','Date','date',1],['category','Category','text',1],['amount','Amount (₹)','number',1],['project','Project','text'],['party','Party / Person','text'],['mode','Payment Mode','select',['Cash','Bank','UPI','Cheque','Other']],['note','Description','textarea']]},contacts:{title:['Client / Supplier','ग्राहक / सप्लायर'],fields:[['kind','Type','select',['Client','Supplier','Both'],1],['name','Name','text',1],['phone','Mobile','tel'],['email','Email','email'],['address','Address','textarea'],['gst','GSTIN','text'],['notes','Notes','textarea']]},billing:{title:['Quotation / Invoice','कोटेशन / इनवॉइस'],fields:[['kind','Document Type','select',['Quotation','Invoice'],1],['number','Bill / Quote Number','text',1],['date','Date','date',1],['client','Client Name','text',1],['project','Project','text'],['description','Work Description','textarea'],['amount','Amount (₹)','number',1],['tax','GST %','number'],['status','Status','select',['Draft','Sent','Approved','Paid','Unpaid']],['notes','Notes','textarea']]},tenders:{title:['Tender / Work Order','टेंडर / वर्क ऑर्डर'],fields:[['name','Tender / Work Name','text',1],['department','Department','text'],['number','Tender / WO Number','text'],['value','Estimated Value (₹)','number'],['lastdate','Last Date','date'],['status','Status','select',['Not Applied','Applied','Won','Lost','Work Order Received']],['notes','Notes','textarea']]},machinery:{title:['Machinery / Vehicle','मशीनरी / वाहन'],fields:[['name','Machine / Vehicle Name','text',1],['number','Registration / ID','text'],['owner','Owned / Rented','select',['Owned','Rented']],['rate','Rent per Day (₹)','number'],['fuel','Fuel / Day (₹)','number'],['service','Last Service Date','date'],['status','Status','select',['Available','In Use','Maintenance']],['notes','Notes','textarea']]}};
const labels={dashboard:['Dashboard','डैशबोर्ड'],projects:['Projects','प्रोजेक्ट'],labour:['Labour & Attendance','मजदूर और हाजिरी'],materials:['Material & Stock','मटेरियल और स्टॉक'],transactions:['Income & Expense','आय और खर्च'],contacts:['Clients & Suppliers','ग्राहक और सप्लायर'],billing:['Quotation & Billing','कोटेशन और बिलिंग'],tenders:['Tenders & Work Orders','टेंडर और वर्क ऑर्डर'],machinery:['Machinery & Vehicles','मशीनरी और वाहन'],reports:['Reports','रिपोर्ट'],backup:['Backup & Settings','बैकअप और सेटिंग']};
const tr=(en,hi)=>lang==='hi'?hi:en;const money=n=>'₹'+Number(n||0).toLocaleString('en-IN',{maximumFractionDigits:2});const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const today=()=>new Date().toISOString().slice(0,10);
function toggleLanguage(){lang=lang==='en'?'hi':'en';document.documentElement.lang=lang;document.getElementById('langBtn').textContent=lang==='en'?'हिंदी':'English';document.querySelectorAll('[data-en]').forEach(el=>el.textContent=el.dataset[lang]);render()}
function toggleMenu(){document.getElementById('sidebar').classList.toggle('open')}
document.getElementById('nav').addEventListener('click',e=>{let b=e.target.closest('button[data-page]');if(!b)return;currentPage=b.dataset.page;document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('active',x===b));document.getElementById('sidebar').classList.remove('open');render()});
function render(){let m=document.getElementById('main');if(currentPage==='dashboard')m.innerHTML=dashboard();else if(currentPage==='reports')m.innerHTML=reports();else if(currentPage==='backup')m.innerHTML=backupPage();else m.innerHTML=modulePage(currentPage);}
function pageHead(title,sub,action=''){return `<div class="page-head"><div><h2>${title}</h2><p>${sub}</p></div>${action}</div>`}
function dashboard(){let income=db.transactions.filter(x=>x.kind==='Income').reduce((a,x)=>a+ +x.amount,0),expense=db.transactions.filter(x=>x.kind==='Expense').reduce((a,x)=>a+ +x.amount,0),due=db.billing.filter(x=>x.status!=='Paid').reduce((a,x)=>a+ +x.amount,0),active=db.projects.filter(x=>x.status==='In Progress').length;let stats=[[tr('Total Projects','कुल प्रोजेक्ट'),db.projects.length,'🏗'],[tr('Active Projects','चालू प्रोजेक्ट'),active,'⚒'],[tr('Total Income','कुल आय'),money(income),'↗'],[tr('Total Expense','कुल खर्च'),money(expense),'↘'],[tr('Net Balance','शेष बैलेंस'),money(income-expense),'₹'],[tr('Outstanding Bills','बकाया बिल'),money(due),'▤'],[tr('Labour Records','मजदूर रिकॉर्ड'),db.labour.length,'👷'],[tr('Material Items','मटेरियल आइटम'),db.materials.length,'📦']];let recent=[...db.transactions].sort((a,b)=>(b.date||'').localeCompare(a.date||'')).slice(0,5);return `${pageHead(tr('Company Dashboard','कंपनी डैशबोर्ड'),tr('Your construction business at a glance','आपकी कंपनी का पूरा सारांश'),`<button class="btn primary" onclick="openForm('transactions')">＋ ${tr('Add Transaction','लेन-देन जोड़ें')}</button>`)}<div class="grid stats">${stats.map(s=>`<div class="card"><div class="stat-label">${s[0]}</div><div class="stat-value">${s[1]}</div><div class="stat-foot">${s[2]} Yasin Infra</div></div>`).join('')}</div><div class="grid two"><div class="card"><div class="section-title"><h3>${tr('Recent Transactions','हाल के लेन-देन')}</h3><button class="btn small" onclick="go('transactions')">${tr('View All','सभी देखें')} →</button></div>${recent.length?tableHTML('transactions',recent):`<div class="empty">${tr('No transactions yet. Add your first entry.','अभी कोई लेन-देन नहीं है। पहली एंट्री जोड़ें।')}</div>`}</div><div class="card"><div class="section-title"><h3>${tr('Quick Actions','जल्दी काम करें')}</h3></div><div class="grid quick">${[['projects','🏗','New Project'],['labour','👷','Add Labour'],['materials','📦','Add Material'],['billing','▤','Create Bill']].map(x=>`<button onclick="go('${x[0]}')">${x[1]}<b>${tr(x[2],({ 'New Project':'नया प्रोजेक्ट','Add Labour':'मजदूर जोड़ें','Add Material':'मटेरियल जोड़ें','Create Bill':'बिल बनाएं'})[x[2]])}</b></button>`).join('')}</div><div class="notice">${tr('Tip: Export a backup regularly and keep a copy outside this device.','सलाह: नियमित रूप से बैकअप डाउनलोड करें और उसकी कॉपी दूसरे डिवाइस पर रखें।')}</div></div></div><div class="footer">© ${new Date().getFullYear()} YASIN INFRA DEVELOPERS · ${tr('Management System','मैनेजमेंट सिस्टम')}</div>`}
function go(p){currentPage=p;document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('active',x.dataset.page===p));render()}
function modulePage(type){let arr=db[type]||[],s=schema[type],title=tr(...labels[type]);let search=`<input class="search" id="searchBox" placeholder="${tr('Search records...','रिकॉर्ड खोजें...')}" oninput="filterTable('${type}')">`;return `${pageHead(title,tr('Manage and maintain your company records','अपनी कंपनी के रिकॉर्ड मैनेज करें'),`<button class="btn primary" onclick="openForm('${type}')">＋ ${tr('Add New','नया जोड़ें')}</button>`)}<div class="toolbar">${search}<button class="btn" onclick="print()">⎙ ${tr('Print','प्रिंट')}</button><button class="btn" onclick="exportCSV('${type}')">⇩ CSV</button></div><div id="tableArea">${tableHTML(type,arr)}</div>`}
function tableHTML(type,arr){if(!arr.length)return `<div class="empty">${tr('No records found. Click “Add New” to begin.','कोई रिकॉर्ड नहीं मिला। शुरू करने के लिए “नया जोड़ें” दबाएं।')}</div>`;let cols={projects:['name','client','location','type','budget','status'],labour:['name','phone','role','rate','advance','status'],materials:['name','unit','qty','rate','supplier','date'],transactions:['date','kind','category','amount','project','mode'],contacts:['kind','name','phone','email','gst'],billing:['kind','number','date','client','project','amount','status'],tenders:['name','department','number','value','lastdate','status'],machinery:['name','number','owner','rate','status']}[type];let heads={name:'Name',client:'Client',location:'Location',type:'Type',budget:'Budget',status:'Status',phone:'Phone',role:'Work / Skill',rate:'Rate',advance:'Advance',unit:'Unit',qty:'Quantity',supplier:'Supplier',date:'Date',kind:'Type',category:'Category',amount:'Amount',project:'Project',mode:'Mode',email:'Email',gst:'GSTIN',number:'Number',value:'Value',lastdate:'Last Date',department:'Department',owner:'Ownership'};return `<div class="table-wrap"><table><thead><tr>${cols.map(c=>`<th>${tr(heads[c]||c,heads[c]||c)}</th>`).join('')}<th>${tr('Actions','एक्शन')}</th></tr></thead><tbody>${arr.map(r=>`<tr>${cols.map(c=>`<td>${c==='amount'||c==='budget'||c==='rate'||c==='advance'||c==='value'?money(r[c]):c==='status'?`<span class="pill">${esc(r[c]||'-')}</span>`:esc(r[c]||'-')}</td>`).join('')}<td><button class="btn small" onclick="editRecord('${type}','${r.id}')">✎</button> <button class="btn small danger" onclick="deleteRecord('${type}','${r.id}')">✕</button></td></tr>`).join('')}</tbody></table></div>`}
function filterTable(type){let q=document.getElementById('searchBox').value.toLowerCase(),arr=db[type].filter(r=>Object.values(r).join(' ').toLowerCase().includes(q));document.getElementById('tableArea').innerHTML=tableHTML(type,arr)}
function openForm(type,id=null){formType=type;editingId=id;let s=schema[type],record=id?db[type].find(x=>x.id===id):{};document.getElementById('modalTitle').textContent=tr(...s.title);document.getElementById('formFields').innerHTML=`<div class="form-grid">${s.fields.map(f=>{let [key,label,kind,opts]=f;let required=opts===1;let val=record?.[key]??(key==='date'?today():'');let input=kind==='textarea'?`<textarea name="${key}">${esc(val)}</textarea>`:kind==='select'?`<select name="${key}">${opts.map(o=>`<option ${val===o?'selected':''}>${esc(o)}</option>`).join('')}</select>`:`<input name="${key}" type="${kind}" value="${esc(val)}" ${required?'required':''} ${kind==='number'?'min="0" step="any"':''}>`;return `<div class="field"><label>${tr(label,hiLabel(label))}${required?' *':''}</label>${input}</div>`}).join('')}</div>`;document.getElementById('modal').classList.add('show')}
function hiLabel(s){let map={'Project Name':'प्रोजेक्ट का नाम','Client Name':'ग्राहक का नाम','Location':'लोकेशन','Project Type':'काम का प्रकार','Budget (₹)':'बजट (₹)','Start Date':'शुरू तारीख','Expected End Date':'अनुमानित समाप्ति','Status':'स्थिति','Notes':'नोट्स','Labour Name':'मजदूर का नाम','Mobile Number':'मोबाइल नंबर','Work / Skill':'काम / कौशल','Daily Wage (₹)':'दैनिक मजदूरी (₹)','Advance (₹)':'एडवांस (₹)','Material Name':'मटेरियल का नाम','Unit':'यूनिट','Quantity':'मात्रा','Rate per Unit (₹)':'प्रति यूनिट रेट (₹)','Supplier':'सप्लायर','Entry Date':'एंट्री तारीख','Transaction Type':'लेन-देन का प्रकार','Date':'तारीख','Category':'कैटेगरी','Amount (₹)':'रकम (₹)','Project':'प्रोजेक्ट','Party / Person':'व्यक्ति / पार्टी','Payment Mode':'पेमेंट तरीका','Description':'विवरण','Type':'प्रकार','Name':'नाम','Mobile':'मोबाइल','Email':'ईमेल','Address':'पता','GSTIN':'जीएसटी नंबर','Document Type':'दस्तावेज का प्रकार','Bill / Quote Number':'बिल / कोटेशन नंबर','Client Name':'ग्राहक का नाम','Work Description':'काम का विवरण','GST %':'जीएसटी %','Tender / Work Name':'टेंडर / काम का नाम','Department':'विभाग','Tender / WO Number':'टेंडर / वर्क ऑर्डर नंबर','Estimated Value (₹)':'अनुमानित रकम (₹)','Last Date':'अंतिम तारीख','Machine / Vehicle Name':'मशीन / वाहन का नाम','Registration / ID':'रजिस्ट्रेशन / आईडी','Owned / Rented':'खुद की / किराये की','Rent per Day (₹)':'दैनिक किराया (₹)','Fuel / Day (₹)':'दैनिक डीजल खर्च (₹)','Last Service Date':'आखिरी सर्विस तारीख'};return map[s]||s}
function closeModal(){document.getElementById('modal').classList.remove('show')}
document.getElementById('recordForm').addEventListener('submit',e=>{e.preventDefault();let obj=Object.fromEntries(new FormData(e.target).entries());for(let k in obj)if(['amount','budget','rate','advance','qty','tax','value','fuel'].includes(k))obj[k]=Number(obj[k]||0);if(editingId){let i=db[formType].findIndex(x=>x.id===editingId);db[formType][i]={...db[formType][i],...obj}}else db[formType].unshift({id:crypto.randomUUID?crypto.randomUUID():String(Date.now()),createdAt:new Date().toISOString(),...obj});saveDB();closeModal();render();toast(tr('Record saved successfully','रिकॉर्ड सफलतापूर्वक सेव हुआ'))});
function editRecord(type,id){openForm(type,id)}function deleteRecord(type,id){if(!confirm(tr('Delete this record permanently?','क्या यह रिकॉर्ड हमेशा के लिए डिलीट करना है?')))return;db[type]=db[type].filter(x=>x.id!==id);saveDB();render();toast(tr('Record deleted','रिकॉर्ड डिलीट हुआ'))}
function toast(msg){let t=document.getElementById('toast');t.textContent=msg;t.style.display='block';setTimeout(()=>t.style.display='none',2400)}
function exportData(){let blob=new Blob([JSON.stringify({app:'YASIN INFRA DEVELOPERS',version:1,exportedAt:new Date().toISOString(),data:db},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='Yasin_Infra_Backup_'+today()+'.json';a.click();URL.revokeObjectURL(a.href);toast(tr('Backup downloaded','बैकअप डाउनलोड हुआ'))}
function importData(input){let f=input.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let parsed=JSON.parse(r.result),data=parsed.data||parsed;if(!confirm(tr('Restore backup? Current data will be replaced.','बैकअप रिस्टोर करें? मौजूदा डेटा बदल जाएगा।')))return;db={...blank,...data};saveDB();render();toast(tr('Backup restored','बैकअप रिस्टोर हुआ'))}catch(e){alert(tr('Invalid backup file','गलत बैकअप फाइल'))}};r.readAsText(f)}
function exportCSV(type){let arr=db[type];if(!arr.length){toast(tr('No data to export','एक्सपोर्ट करने के लिए डेटा नहीं'));return}let keys=[...new Set(arr.flatMap(x=>Object.keys(x)))],csv=[keys.join(','),...arr.map(r=>keys.map(k=>'"'+String(r[k]??'').replace(/"/g,'""')+'"').join(','))].join('\n'),blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='Yasin_'+type+'_'+today()+'.csv';a.click();URL.revokeObjectURL(a.href)}
function reports(){let inc=db.transactions.filter(x=>x.kind==='Income').reduce((a,x)=>a+ +x.amount,0),exp=db.transactions.filter(x=>x.kind==='Expense').reduce((a,x)=>a+ +x.amount,0),paid=db.billing.filter(x=>x.status==='Paid').reduce((a,x)=>a+ +x.amount,0),unpaid=db.billing.filter(x=>x.status!=='Paid').reduce((a,x)=>a+ +x.amount,0);return `${pageHead(tr('Business Reports','व्यवसाय रिपोर्ट'),tr('Financial summary from records entered in this software','सॉफ्टवेयर में दर्ज रिकॉर्ड के आधार पर वित्तीय सारांश'),`<button class="btn" onclick="print()">⎙ ${tr('Print Report','रिपोर्ट प्रिंट')}</button>`)}<div class="grid stats">${[[tr('Income','कुल आय'),money(inc)],[tr('Expenses','कुल खर्च'),money(exp)],[tr('Net Profit / Loss','शुद्ध लाभ / हानि'),money(inc-exp)],[tr('Paid Invoices','भरे हुए बिल'),money(paid)],[tr('Unpaid Invoices','बकाया बिल'),money(unpaid)],[tr('Projects','कुल प्रोजेक्ट'),db.projects.length],[tr('Labour','मजदूर'),db.labour.length],[tr('Stock Entries','स्टॉक एंट्री'),db.materials.length]].map(x=>`<div class="card"><div class="stat-label">${x[0]}</div><div class="stat-value">${x[1]}</div></div>`).join('')}</div><div class="card"><h3>${tr('Important note','जरूरी सूचना')}</h3><p class="muted">${tr('Reports are calculated from entries you have saved. Enter all receipts, payments and expenses to keep the totals accurate. This is a basic management report, not a statutory accounting or GST filing system.','रिपोर्ट आपके सेव किए गए रिकॉर्ड से बनती है। सही हिसाब के लिए सभी प्राप्तियां, भुगतान और खर्च दर्ज करें। यह सामान्य मैनेजमेंट रिपोर्ट है, वैधानिक अकाउंटिंग या GST रिटर्न सिस्टम नहीं।')}</p></div>`}
function backupPage(){return `${pageHead(tr('Backup & Settings','बैकअप और सेटिंग'),tr('Protect your company data and manage preferences','कंपनी का डेटा सुरक्षित रखें'),`<button class="btn primary" onclick="exportData()">⇩ ${tr('Download Backup','बैकअप डाउनलोड')}</button>`)}<div class="grid two"><div class="card"><h3 class="gold">${tr('Local Data Backup','लोकल डेटा बैकअप')}</h3><p class="muted">${tr('Your entries are stored in this browser on this device. Download a JSON backup regularly. Keep the file in another safe location.','आपकी एंट्री इसी डिवाइस के ब्राउज़र में सेव होती हैं। नियमित रूप से JSON बैकअप डाउनलोड करें और फाइल को सुरक्षित दूसरी जगह रखें।')}</p><button class="btn primary" onclick="exportData()">⇩ ${tr('Export Backup (JSON)','बैकअप एक्सपोर्ट (JSON)')}</button><div class="field" style="margin-top:18px"><label>${tr('Restore from backup file','बैकअप फाइल से रिस्टोर करें')}</label><input type="file" accept=".json,application/json" onchange="importData(this)"></div></div><div class="card"><h3 class="gold">${tr('Online Cloud Backup','ऑनलाइन क्लाउड बैकअप')}</h3><div class="notice">${tr('Cloud sync is not connected in this standalone HTML version. Automatic online backup requires a secure server / cloud database and account setup.','इस HTML वर्जन में क्लाउड सिंक कनेक्ट नहीं है। ऑटोमैटिक ऑनलाइन बैकअप के लिए सुरक्षित सर्वर / क्लाउड डेटाबेस और अकाउंट सेटअप जरूरी है।')}</div><p class="muted">${tr('For now, export the backup file and upload it to your own Google Drive or other cloud storage manually.','फिलहाल बैकअप फाइल डाउनलोड करके अपने Google Drive या अन्य क्लाउड स्टोरेज पर खुद अपलोड करें।')}</p></div><div class="card"><h3 class="gold">${tr('Storage Information','स्टोरेज जानकारी')}</h3><p>${tr('Saved records','सेव रिकॉर्ड')}: <b>${Object.values(db).reduce((a,x)=>a+x.length,0)}</b></p><p>${tr('Last opened','आखिरी बार खोला')}: <b>${new Date().toLocaleString()}</b></p><button class="btn" onclick="saveDB();toast(tr('Data saved','डेटा सेव हुआ'))">${tr('Save Now','अभी सेव करें')}</button></div><div class="card"><h3 class="danger-text">${tr('Danger Zone','सावधानी')}</h3><p class="muted">${tr('This permanently removes all records from this browser. Download a backup first.','इससे इस ब्राउज़र के सभी रिकॉर्ड हमेशा के लिए हट जाएंगे। पहले बैकअप डाउनलोड करें।')}</p><button class="btn danger" onclick="clearAll()">${tr('Delete All Company Data','सारा डेटा डिलीट करें')}</button></div></div>`}
function clearAll(){if(!confirm(tr('Are you sure? This cannot be undone.','क्या आप निश्चित हैं? यह वापस नहीं होगा।')))return;if(!confirm(tr('Final confirmation: delete every saved record?','आखिरी पुष्टि: सभी सेव रिकॉर्ड डिलीट करें?')))return;db={...blank};saveDB();render();toast(tr('All data cleared','सारा डेटा हटा दिया गया'))}
render();
</script></body></html>
